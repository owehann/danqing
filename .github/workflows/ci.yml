name: Danqing Studio & Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-danqing:
    name: Lossless Engine, Palette QC & Studio Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js 22 & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build TypeScript + Vite Frontend SPA
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Verify Python syntax compilation
        run: |
          python -m py_compile core/danqing/*.py web/backend/*.py scripts/*.py tests/*.py

      - name: Run i18n Parity, Runtime License & Palette QC Gates
        run: |
          python scripts/check_i18n_strings.py
          python scripts/check_licenses.py
          python scripts/palette_qc.py

      - name: Portability & Privacy Gate (zero hardcoded local paths or tokens)
        run: |
          if grep -rnE "/Users/[A-Za-z]|/home/[a-z]+/|C:\\\\Users|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}" \
               --include='*.py' --include='*.sh' --include='*.md' --include='*.json' --include='*.ts' --include='*.tsx' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "Hardcoded local path or token found!"; exit 1; fi

      - name: Run Pytest Suite (Preview==Export, Gate G0 Shield & Multi-Visitor Isolation)
        run: |
          pytest -q
