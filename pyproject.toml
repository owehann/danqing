[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danqing"
version = "0.2.0"
description = "Semantic & Artifact-Inspired Color Engine for Scientific Figures (Lossless Vector PDF/SVG Recoloring, Coupled Gradients, and Gate G0 Evidence Shield)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "owehann" }
]

[project.urls]
Homepage = "https://github.com/owehann/danqing"
Repository = "https://github.com/owehann/danqing"
Issues = "https://github.com/owehann/danqing/issues"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pillow>=10.2",
  "pikepdf>=9.0",
  "pypdfium2>=4.30",
  "resvg-py>=0.2",
  "lxml>=5.1",
  "coloraide>=4.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core"]
