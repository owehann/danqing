[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danqing"
version = "0.4.1"
description = "Lossless Scientific Figure & Manuscript Recoloring Studio, 3,434 Verified Palettes, and MCP Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Xinyin Han" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pillow>=10.2",
  "pikepdf>=9.0",
  "pypdfium2>=4.30",
  "resvg-py>=0.2",
  "lxml>=5.1",
  "coloraide>=4.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.scripts]
danqing-mcp = "danqing.mcp_server:main"

[project.urls]
Homepage = "https://danqing.onrender.com"
Repository = "https://github.com/owehann/danqing"
Issues = "https://github.com/owehann/danqing/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
"danqing.palettes" = ["data/*.json", "VERIFICATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core"]
