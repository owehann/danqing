<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Danqing — Scientific Figure Recoloring</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Machado et al. (2009) physiologically-based CVD simulation matrices (preview-only on figure canvas) -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
      <defs>
        <filter id="danqing-cvd-deutan" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.367322  0.860646 -0.227968 0 0
                    0.280085  0.672501  0.047413 0 0
                   -0.011820  0.042940  0.968881 0 0
                    0         0         0        1 0"
          />
        </filter>
        <filter id="danqing-cvd-protan" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="0.152286  1.052583 -0.204868 0 0
                    0.114503  0.786281  0.099216 0 0
                   -0.003882 -0.048116  1.051998 0 0
                    0         0         0        1 0"
          />
        </filter>
        <filter id="danqing-cvd-tritan" color-interpolation-filters="linearRGB">
          <feColorMatrix
            type="matrix"
            values="1.255528 -0.076749 -0.178779 0 0
                   -0.078411  0.930809  0.147602 0 0
                    0.004733  0.691367  0.303900 0 0
                    0         0         0        1 0"
          />
        </filter>
        <filter id="danqing-cvd-grayscale" color-interpolation-filters="sRGB">
          <feColorMatrix
            type="matrix"
            values="0.2126 0.7152 0.0722 0 0
                    0.2126 0.7152 0.0722 0 0
                    0.2126 0.7152 0.0722 0 0
                    0      0      0      1 0"
          />
        </filter>
      </defs>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
