<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" data-locked-special="true">
  <rect x="4" y="4" width="552" height="292" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <!-- Plasma Membrane Bilayer -->
  <rect x="18" y="54" width="524" height="14" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.0"/>
  <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#475569">Plasma Membrane</text>
  <!-- EGFR Dimer -->
  <rect x="74" y="28" width="44" height="58" rx="10" fill="#5B7FA6" stroke="#1E3A5F" stroke-width="1.4"/>
  <text x="96" y="61" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">EGFR</text>
  <!-- Cascade Nodes: GRB2/SOS -> RAS-GTP -> BRAF -> MEK1/2 -> p-ERK1/2 -->
  <path d="M 96 86 L 96 118 L 138 118" fill="none" stroke="#334155" stroke-width="1.8"/>
  <polygon points="138,114 146,118 138,122" fill="#334155"/>
  <rect x="148" y="98" width="76" height="40" rx="8" fill="#5FA292" stroke="#115E59" stroke-width="1.3"/>
  <text x="186" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">RAS-GTP</text>

  <line x1="224" y1="118" x2="256" y2="118" stroke="#334155" stroke-width="1.8"/>
  <polygon points="256,114 264,118 256,122" fill="#334155"/>
  <rect x="266" y="98" width="72" height="40" rx="8" fill="#E09F5A" stroke="#92400E" stroke-width="1.3"/>
  <text x="302" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">BRAF</text>

  <line x1="338" y1="118" x2="370" y2="118" stroke="#334155" stroke-width="1.8"/>
  <polygon points="370,114 378,118 370,122" fill="#334155"/>
  <rect x="380" y="98" width="76" height="40" rx="8" fill="#D9796C" stroke="#7F1D1D" stroke-width="1.3"/>
  <text x="418" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">MEK1/2</text>

  <!-- Nuclear Envelope & p-ERK1/2 -->
  <rect x="160" y="176" width="360" height="98" rx="16" fill="#FEF2F2" stroke="#C85A53" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="178" y="196" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#991B1B">Nucleus (KEGG hsa04012)</text>
  <path d="M 418 138 L 418 206" fill="none" stroke="#C85A53" stroke-width="2.0"/>
  <polygon points="414,204 418,213 422,204" fill="#C85A53"/>
  <rect x="366" y="214" width="104" height="40" rx="8" fill="#C85A53" stroke="#7F1D1D" stroke-width="1.4"/>
  <text x="418" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">p-ERK1/2</text>

  <line x1="366" y1="234" x2="312" y2="234" stroke="#7F1D1D" stroke-width="1.8"/>
  <polygon points="314,230 305,234 314,238" fill="#7F1D1D"/>
  <rect x="192" y="214" width="112" height="40" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <text x="248" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0F172A">MYC / CCND1</text>
</svg>